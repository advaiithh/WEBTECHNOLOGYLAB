<!DOCTYPE html>
<html>

<head>
    <title>Astrology Consultation Form</title>

    <style>
        body {
            background-color: #f3e8ff;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        form {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 2px solid gray;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        input[type=radio],
        input[type=checkbox],
        input[type=color],
        input[type=range] {
            width: auto;
        }

        input[type=submit],
        input[type=reset] {
            width: auto;
            padding: 10px 20px;
            background-color: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h2>Astrology Consultation Form</h2>

    <form>

        <label>Full Name</label><br>
        <input type="text"
            placeholder="Enter your name"
            pattern="[A-Za-z ]{3,30}"
            required>

        <label>Email</label><br>
        <input type="email"
            placeholder="example@gmail.com"
            required>

        <label>Password</label><br>
        <input type="password"
            placeholder="Minimum 8 characters"
            pattern=".{8,}"
            required>

        <label>Age</label><br>
        <input type="number"
            min="18"
            max="80"
            required>

        <label>Date of Birth</label><br>
        <input type="date"
            required>

        <label>Gender</label><br>

        <input type="radio" name="gender" required> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other

        <br><br>

        <label>Services Required</label><br>

        <input type="checkbox"> Daily Horoscope

        <input type="checkbox"> Career Prediction

        <input type="checkbox"> Marriage Matching

        <input type="checkbox"> Health Astrology

        <br><br>

        <label>Select Zodiac Sign</label><br>

        <select required>

            <option value="">--Select Zodiac--</option>

            <option>Aries</option>

            <option>Taurus</option>

            <option>Gemini</option>

            <option>Cancer</option>

            <option>Leo</option>

            <option>Virgo</option>

            <option>Libra</option>

            <option>Scorpio</option>

            <option>Sagittarius</option>

            <option>Capricorn</option>

            <option>Aquarius</option>

            <option>Pisces</option>

        </select>

        <label>Tell Us Your Question</label><br>

        <textarea rows="4"
            placeholder="Write your astrology question"
            required></textarea>

        <label>Select Lucky Color</label><br>

        <input type="color">

        <br><br>

        <label>Upload Birth Certificate</label><br>

        <input type="file">

        <br><br>

        <label>Interest in Astrology</label><br>

        Low

        <input type="range"
            min="0"
            max="100"
            value="50">

        High

        <br><br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
